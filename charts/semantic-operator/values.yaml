# All connection details are values. Nothing is hardcoded in the images.

image:
  manager:
    repository: public.ecr.aws/data-on-eks/semantic-operator/manager
  server:
    repository: public.ecr.aws/data-on-eks/semantic-operator/server
  tag: "v0.1.1"
  pullPolicy: IfNotPresent

# Query engine the semantic layer compiles for and connects to. One engine
# per install; `type` selects both the SQL dialect and the connection client.
engine:
  # starrocks | trino
  type: starrocks
  # Query-time engine identity. static runs every query under the server's own
  # credential. passthrough forwards the caller's validated token to the engine
  # so the engine can enforce per-user policy, and requires server.auth.mode=jwt.
  identityMode: static
  # Token claim used as the engine session user under passthrough. It must match
  # the engine's own principal claim (for example Trino's
  # http-server.authentication.jwt.principal-field). Required when identityMode
  # is passthrough. Kept separate from server.auth.principalClaim so the engine
  # username can differ from the governance principal.
  userClaim: ""
  # RFC 8693 token exchange settings, used when identityMode is exchange. The
  # server exchanges the caller's token for an engine-audience token, same
  # subject, via the authorization server's token endpoint.
  exchange:
    tokenURL: ""            # e.g. https://idp/realms/semantic/protocol/openid-connect/token
    clientID: ""            # confidential client permitted to exchange
    clientSecretSecret:
      name: ""
      key: client-secret
    # Permit a plaintext http tokenURL. The exchange sends the caller token and
    # the client secret, so leave this false unless the endpoint is reached only
    # over trusted in-cluster networking.
    allowInsecureHTTP: false
  # Engine endpoint. Empty falls back to the legacy starrocks.host value.
  host: ""            # e.g. trino.trino.svc.cluster.local
  # 0 uses the engine's default port (starrocks 9030, trino 8080).
  port: 0
  # TLS options for the engine connection.
  tls:
    # Force an HTTPS engine connection. Needed when the engine requires TLS but
    # no password is set, such as token-based authentication. A password also
    # implies HTTPS.
    enabled: false
    # Skip engine server certificate verification. For isolated development
    # against a self-signed engine only. Must stay false in production.
    # Honored by the Trino client.
    insecureSkipVerify: false
  # Empty falls back to starrocks.user (each client also has its own default).
  user: ""
  # Reference an existing Secret holding the password; empty name falls back
  # to starrocks.passwordSecret. Note: the Trino client requires TLS when a
  # password is set.
  passwordSecret:
    name: ""
    key: password
  # Per-deployment credentials. Least privilege wants two database users:
  # the operator reads metadata and creates views, the server only selects.
  # Unset values fall back to the shared engine.user / engine.passwordSecret.
  #   manager: metadata read (information_schema/DESC) + DDL on the view schema
  #   server:  SELECT on the schemas the models bind, no DDL
  manager:
    user: ""
    passwordSecret:
      name: ""
      key: password
  server:
    user: ""
    passwordSecret:
      name: ""
      key: password

# Legacy StarRocks block. Still honored when the engine block above leaves
# host/user/passwordSecret empty and engine.type is starrocks.
starrocks:
  host: ""            # e.g. starrocks-fe.starrocks.svc.cluster.local
  port: 9030
  user: root
  # Reference an existing Secret holding the password; leave name empty for
  # passwordless dev clusters.
  passwordSecret:
    name: ""
    key: password
  # Name of the StarRocks external catalog that fronts Iceberg/Glue. Used by
  # the demo resources and documented for CR authors; each SemanticModel CR
  # pins its own catalog in spec.connection.
  icebergCatalog: iceberg

# Existing Valkey (Redis-protocol). Optional; empty addr disables caching.
valkey:
  addr: ""            # e.g. valkey.valkey.svc.cluster.local:6379
  passwordSecret:
    name: ""
    key: password
  db: 0

manager:
  replicas: 1
  leaderElect: true
  # Namespaces the manager reconciles. Empty means the release namespace only,
  # which is the default and needs no ClusterRole.
  #
  # The default matches what this release's server can serve. The server loads
  # compiled artifacts from its own namespace, so a manager reconciling models
  # elsewhere would introspect the engine, create views, and publish artifacts
  # that this server never reads.
  #
  # Listing namespaces issues one Role and RoleBinding in each. Anything
  # outside the server's namespace is reconciled and published but NOT served
  # by this release. That is a valid manager-only or view-management setup, and
  # the chart prints a warning so it is never a surprise. To serve those models
  # too, install a second release with its server in that namespace.
  #
  #   watchNamespaces:
  #     - analytics
  #     - finance
  watchNamespaces: []
  # Cluster-wide operation. Grants a ClusterRole over SemanticModels and
  # ConfigMaps in every namespace, so a compromised manager can rewrite
  # compiled artifacts anywhere the CRD exists. Opt in deliberately. Mutually
  # exclusive with watchNamespaces; setting both fails rendering.
  watchAllNamespaces: false
  # Drift-detection cadence.
  resyncPeriod: 5m
  # StarRocks default-catalog database where governed views are created.
  viewDatabase: semantic_views
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

server:
  replicas: 2
  logLevel: info
  # Bounds on one request and its result. Every value here is optional and
  # overrides a built-in default, shown in brackets. Leaving one unset means
  # the default applies, never that the bound is removed.
  #
  # A request over a bound is refused rather than trimmed, because a silently
  # truncated result cannot be told apart from a complete one.
  query:
    # Applied when a request names no limit. [1000]
    defaultRowLimit: ~
    # Largest limit a caller may ask for. [10000]
    maxRowLimit: ~
    maxMetrics: ~       # [25]
    maxDimensions: ~    # [25]
    maxFilters: ~       # [50]
    maxFilterValues: ~  # [1000] values in one IN list
    # Encoded result ceiling in bytes. Catches results that are small in rows
    # but large in bytes. [33554432, 32Mi]
    maxResultBytes: ~
    # Results above this are returned but not cached. [8388608, 8Mi]
    maxCacheEntryBytes: ~
    # Include each metric's raw SQL expression in listings. Off by default:
    # the expression is the definition itself, and an agent grounds on the
    # name, description, and synonyms.
    exposeMetricExpressions: false
    # Maximum decoded JSON request body in bytes. [1048576, 1Mi]
    maxRequestBytes: ~
    # Requests in flight at once. This is a memory budget, not a throughput
    # setting: each in-flight request can hold a whole result until its
    # response is written, so
    #
    #   maxConcurrent x maxResultBytes  +  the encoded copy made while
    #   serializing
    #
    # must stay comfortably under server.resources.limits.memory. The defaults
    # are 4 x 32Mi, about 128Mi of results against a 512Mi pod. Raising either
    # one means raising the memory limit too. [4]
    maxConcurrent: ~
    # How long a request waits for a slot before it is refused with 503.
    # Waiting forever turns a load problem into a timeout problem further
    # out, so the queue is bounded. [5]
    queueWaitSeconds: ~
  # HTTP server bounds. Defaults in brackets, all optional.
  #
  # There is deliberately no global write timeout. MCP streams its responses,
  # so a server-wide write deadline would truncate them. The REST routes carry
  # their own deadline instead, set by restTimeoutSeconds.
  http:
    readTimeoutSeconds: ~   # [30] whole request including body
    idleTimeoutSeconds: ~   # [120] keep-alive idle
    restTimeoutSeconds: ~   # [60] deadline on /v1/ routes only
    maxHeaderBytes: ~       # [1048576, 1Mi]
  # How the caller's identity is established.
  #
  #   header  X-Semantic-User and X-Semantic-Role are trusted verbatim. Only
  #           safe behind a proxy that authenticates the caller AND overwrites
  #           both headers, because any client that reaches the port can
  #           otherwise claim any identity.
  #   jwt     a bearer token is required and validated against the issuer's
  #           JWKS; principal, groups, and roles come from configured claims.
  #           Inbound identity headers are ignored. Use this in production.
  auth:
    # jwt is the production profile. header mode is refused unless
    # allowInsecureHeaderAuth is also set, because it trusts whatever the
    # caller sends.
    #
    # Running header mode safely means the proxy in front must, in this order,
    # authenticate the caller, strip inbound X-Semantic-User and
    # X-Semantic-Role, and then set both headers itself. Skipping the strip is
    # the whole vulnerability: a client simply sends the identity it wants.
    mode: header
    allowInsecureHeaderAuth: false
    # jwt mode only. jwksURL is required; issuer and audience are enforced
    # when set. principalClaim identifies the user known to policy providers
    # and defaults to the standard subject claim. roleClaim and groupsClaim may
    # address nested claims with dots.
    #
    # Groups and roles remain separate for external providers. Built-in
    # governance uses their union as policy labels, but their permissions are
    # not pooled. Some single policy label must permit every metric and field
    # in a request on its own.
    jwksURL: ""
    principalClaim: sub
    groupsClaim: ""
    issuer: ""
    audience: ""
    roleClaim: role
    # Claims copied into the identity for {{claim.name}} row-filter placeholders.
    claimsToCopy: []
  # External query authorization providers. Helm renders this list into the
  # server config file (a ConfigMap mounted read-only by the server).
  # SemanticModels refer to providers by logical name through
  # spec.governance.external.providerRef. URLs and credentials stay in
  # deployment configuration so a model author cannot redirect authorization
  # requests or read provider secrets. Bearer-token values stay in their
  # referenced Secrets and are injected as environment variables, never written
  # into the rendered config.
  authorization:
    providers: []
    # - name: corporate-opa
    #   type: opa
    #   url: https://opa.semantic-system.svc.cluster.local:8181
    #   timeoutSeconds: 2
    #   maxResponseBytes: 1048576
    #   bearerTokenSecret:
    #     name: ""
    #     key: token
    #   opa:
    #     decisionPath: semantic/query/allow
    #
    # - name: corporate-ranger
    #   type: ranger
    #   # The Ranger URL is the complete API base. Standard PDP deployments
    #   # use a base ending in /authz/v1.
    #   url: https://ranger-pdp.semantic-system.svc.cluster.local:6500/authz/v1
    #   timeoutSeconds: 2
    #   maxResponseBytes: 1048576
    #   # Service mode sends X-Forwarded-User with servicePrincipal on every
    #   # PDP request. Trusted headers require an HTTPS URL by default.
    #   ranger:
    #     authenticationMode: service
    #     servicePrincipal: semantic-server
    #     # Development only. This permits credentials and trusted headers over
    #     # plain HTTP and must remain false in production.
    #     allowInsecureHTTP: false
    #     serviceType: semantic-operator
    #     serviceName: semantic-prod
    #     resource: "semantic-model:namespace={namespace},model={resource}"
    #     permission: query
    #     # Trusted static strings sent with every request. Do not put secrets
    #     # here. clientType, requestData, and semantic.* are reserved.
    #     contextAttributes:
    #       environment: production
    #       clusterName: analytics-prod
  listenPort: 8090
  planCacheTTL: 24h
  resultCacheTTL: 60s
  # OTLP/HTTP traces endpoint; empty disables tracing.
  otelEndpoint: ""
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 512Mi}
  # Keeps at most one server pod unavailable during a voluntary disruption
  # such as a node drain. maxUnavailable rather than minAvailable, so a
  # single-replica install can still be drained instead of blocking forever.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Prefer spreading server pods across nodes. ScheduleAnyway by default, so a
  # single-node or kind cluster still schedules them.
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  # Pause before shutdown so endpoint removal reaches every proxy and in-flight
  # requests are not cut off. Uses the native sleep lifecycle action, which
  # needs Kubernetes 1.29 or newer; on older clusters the hook is skipped
  # because the distroless image has no shell to run an exec hook.
  gracefulShutdown:
    enabled: true
    preStopSleepSeconds: 5
    # Must exceed preStopSleepSeconds plus the server's 10s shutdown deadline.
    terminationGracePeriodSeconds: 30
  # For a cold start slower than the liveness probe tolerates, usually a
  # distant JWKS or query engine. Off by default.
  startupProbe:
    enabled: false
    periodSeconds: 5
    failureThreshold: 30
  # Needs metrics-server, so off by default. When on, the Deployment stops
  # setting replicas and the autoscaler owns the count.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: ~
  service:
    # ClusterIP only. The server trusts X-Semantic-User and X-Semantic-Role
    # in header mode and expects an authenticating proxy in front, so publishing it
    # directly (LoadBalancer/NodePort) creates an unauthenticated query
    # endpoint. Reach it with `kubectl port-forward`. The chart refuses any
    # other type unless allowExternalExposure is set, which you should only
    # do when an authenticating ingress already fronts the service.
    type: ClusterIP
    allowExternalExposure: false
    port: 8090

# Ingress lockdown for the two deployments. Requires a CNI that enforces
# NetworkPolicy (Calico, Cilium, or the EKS VPC CNI with
# --enable-network-policy=true; without enforcement these objects are inert).
# Pods in the release namespace can always reach the server; callers elsewhere
# must be named in allowFrom. kubectl port-forward is unaffected.
networkPolicy:
  enabled: true
  # Extra ingress peers for the server, in NetworkPolicyPeer form, e.g.
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: agents}
  #   - podSelector:
  #       matchLabels: {app: my-bi-gateway}
  allowFrom: []
  # Peers allowed to scrape /metrics on both deployments, e.g.
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: monitoring}
  allowMetricsFrom: []
  # Egress is open by default: the query engine, Valkey, the Kubernetes API,
  # and DNS are all deployment-specific. Set restrictEgress and supply the
  # rules to lock it down.
  restrictEgress: false
  egress: []

serviceAccount:
  manager:
    create: true
    name: ""
    # The operator needs no cloud credentials: catalog sources (Glue, DataHub,
    # Polaris) are used only by ossiectl, which runs with a human's credentials.
    annotations: {}
  server:
    create: true
    name: ""
    annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
