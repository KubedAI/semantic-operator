suite: rbac serviceaccount identity
# The ServiceAccount names are referenced in four places: the two Deployments,
# the SA objects here, and every binding subject. If a rename touches only some
# of them, a binding silently grants nothing and the component loses access. The
# Deployment side is asserted in the deployment suites; here we pin the SA
# objects and that each binding subject targets the right SA in the release
# namespace.
release:
  name: my-release
  namespace: prod
templates:
  - templates/rbac.yaml
set:
  engine.host: engine.example
  server.auth.allowInsecureHeaderAuth: true
tests:
  - it: creates the manager and server ServiceAccounts in the release namespace
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: semantic-operator-manager
          namespace: prod
          any: true
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: semantic-operator-server
          namespace: prod
          any: true

  - it: the manager RoleBinding binds the manager ServiceAccount
    documentSelector:
      path: roleRef.name
      value: semantic-operator-manager
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: semantic-operator-manager
      - equal:
          path: subjects[0].namespace
          value: prod

  - it: the leader-election RoleBinding binds the manager ServiceAccount
    documentSelector:
      path: roleRef.name
      value: semantic-operator-leader-election
    asserts:
      - equal:
          path: subjects[0].name
          value: semantic-operator-manager
      - equal:
          path: subjects[0].namespace
          value: prod

  - it: the server RoleBinding binds the server ServiceAccount
    documentSelector:
      path: roleRef.name
      value: semantic-operator-server
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: semantic-operator-server
      - equal:
          path: subjects[0].namespace
          value: prod
