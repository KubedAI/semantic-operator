suite: server availability and shutdown defaults
# Availability defaults must not depend on optional cluster features and must
# not block a drain: a soft topology spread, and a native sleep preStop hook
# that only appears on Kubernetes 1.29+ because the distroless image has no
# shell for an exec hook.
templates:
  - templates/server-deployment.yaml
tests:
  - it: the topology spread is soft so single-node clusters still schedule
    set:
      engine.host: engine.example
      server.auth.allowInsecureHeaderAuth: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: adds a native sleep preStop hook on Kubernetes 1.29 and newer
    set:
      engine.host: engine.example
      server.auth.allowInsecureHeaderAuth: true
    capabilities:
      majorVersion: 1
      minorVersion: 29
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
      - notExists:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec

  - it: skips the preStop hook before Kubernetes 1.29
    set:
      engine.host: engine.example
      server.auth.allowInsecureHeaderAuth: true
    capabilities:
      majorVersion: 1
      minorVersion: 28
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
