apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "semantic-operator.name" . }}-server-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ include "semantic-operator.serverConfig" . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "semantic-operator.name" . }}-manager-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ include "semantic-operator.managerConfig" . | indent 4 }}
