{{- if .Values.serviceAccount.manager.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "semantic-operator.managerSA" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.manager.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.serviceAccount.server.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "semantic-operator.serverSA" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.server.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "semantic-operator.name" . }}-manager
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [semantic.ossie.io]
    resources: [semanticmodels]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [semantic.ossie.io]
    resources: [semanticmodels/status, semanticmodels/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "semantic-operator.name" . }}-manager
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "semantic-operator.name" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "semantic-operator.managerSA" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election needs Lease access in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "semantic-operator.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "semantic-operator.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "semantic-operator.name" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "semantic-operator.managerSA" . }}
    namespace: {{ .Release.Namespace }}
---
# The server only reads published ConfigMaps in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "semantic-operator.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "semantic-operator.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "semantic-operator.name" . }}-server
subjects:
  - kind: ServiceAccount
    name: {{ include "semantic-operator.serverSA" . }}
    namespace: {{ .Release.Namespace }}
