apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-operator.name" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
        app.kubernetes.io/component: manager
      annotations:
        semantic.ossie.io/config-checksum: {{ include "semantic-operator.managerConfig" . | sha256sum | trunc 16 }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "semantic-operator.managerSA" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: "{{ include "semantic-operator.image" (dict "root" . "component" "manager") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config={{ include "semantic-operator.configPath" . }}
          env:
            {{- /* Non-secret configuration comes from the mounted config file.
                   Only the engine password is injected here as a Secret env. */}}
            {{- include "semantic-operator.enginePasswordEnv" (dict "root" . "component" "manager") | nindent 12 }}
          ports:
            - {containerPort: 8080, name: metrics}
            - {containerPort: 8081, name: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/semantic-operator
              readOnly: true
          resources: {{- toYaml .Values.manager.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "semantic-operator.name" . }}-manager-config
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
