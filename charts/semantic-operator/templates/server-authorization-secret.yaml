{{- $authorization := .Values.server.authorization | default dict -}}
{{- $providers := $authorization.providers | default list -}}
{{- if $providers -}}
{{- $providerConfigs := list -}}
{{- range $i, $provider := $providers -}}
{{- $secret := $provider.bearerTokenSecret | default dict -}}
{{- $type := $provider.type | default "opa" -}}
{{- $config := dict
      "name" (required (printf "server.authorization.providers[%d].name is required" $i) $provider.name)
      "type" $type
      "url" (required (printf "server.authorization.providers[%d].url is required" $i) $provider.url)
      "timeoutSeconds" ($provider.timeoutSeconds | default 2)
      "maxResponseBytes" ($provider.maxResponseBytes | default 1048576) -}}
{{- if eq $type "opa" -}}
{{- $opa := $provider.opa | default dict -}}
{{- $_ := set $config "opa" (dict
      "decisionPath" (required (printf "server.authorization.providers[%d].opa.decisionPath is required" $i) $opa.decisionPath)) -}}
{{- else if eq $type "ranger" -}}
{{- $ranger := $provider.ranger | default dict -}}
{{- $_ := set $config "ranger" (dict
      "authenticationMode" ($ranger.authenticationMode | default "service")
      "serviceType" (required (printf "server.authorization.providers[%d].ranger.serviceType is required" $i) $ranger.serviceType)
      "serviceName" (required (printf "server.authorization.providers[%d].ranger.serviceName is required" $i) $ranger.serviceName)
      "resource" (required (printf "server.authorization.providers[%d].ranger.resource is required" $i) $ranger.resource)
      "permission" (required (printf "server.authorization.providers[%d].ranger.permission is required" $i) $ranger.permission)
      "contextAttributes" ($ranger.contextAttributes | default dict)) -}}
{{- else -}}
{{- fail (printf "server.authorization.providers[%d].type %q is not supported: use opa or ranger" $i $type) -}}
{{- end -}}
{{- if $secret.name -}}
{{- $_ := set $config "bearerTokenEnv" (printf "AUTHORIZATION_PROVIDER_TOKEN_%d" $i) -}}
{{- end -}}
{{- $providerConfigs = append $providerConfigs $config -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semantic-operator.name" . }}-server-authorization
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  providers.yaml: |
{{ $providerConfigs | toYaml | indent 4 }}
{{- end }}
