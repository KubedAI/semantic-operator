apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-operator.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.listenPort | quote }}
        prometheus.io/path: /metrics
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "semantic-operator.serverSA" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: "{{ required "image.repository is required" .Values.image.repository }}/server:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "semantic-operator.engineEnv" (dict "root" . "component" "server") | nindent 12 }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.server.listenPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            {{- /* Nil-safe for --reuse-values from a release predating auth. */ -}}
            {{- $auth := .Values.server.auth | default dict }}
            - name: AUTH_MODE
              value: {{ $auth.mode | default "header" | quote }}
            {{- if eq ($auth.mode | default "header") "jwt" }}
            - name: OIDC_JWKS_URL
              value: {{ required "server.auth.jwksURL is required when auth.mode is jwt" $auth.jwksURL | quote }}
            {{- with $auth.issuer }}
            - name: OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with $auth.audience }}
            - name: OIDC_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with $auth.roleClaim }}
            - name: OIDC_ROLE_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with $auth.claimsToCopy }}
            - name: OIDC_CLAIMS_TO_COPY
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PLAN_CACHE_TTL
              value: {{ .Values.server.planCacheTTL | quote }}
            - name: RESULT_CACHE_TTL
              value: {{ .Values.server.resultCacheTTL | quote }}
            {{- if .Values.valkey.addr }}
            - name: VALKEY_ADDR
              value: {{ .Values.valkey.addr | quote }}
            - name: VALKEY_DB
              value: {{ .Values.valkey.db | quote }}
            {{- if .Values.valkey.passwordSecret.name }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.passwordSecret.name }}
                  key: {{ .Values.valkey.passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- if .Values.server.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.server.otelEndpoint | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.server.listenPort }}
              name: http
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{/*
  Refuse to expose the semantic server outside the cluster by default. The
  server authorizes callers from the X-Semantic-Role header and expects an
  authenticating proxy in front of it (see docs/ARCHITECTURE.md), so a
  LoadBalancer here means an unauthenticated query endpoint on a public IP.
  Access it with `kubectl port-forward` instead. A deployment that really has
  an authenticating ingress in front can opt in explicitly.
*/}}
{{- $svcType := .Values.server.service.type -}}
{{- if and (ne $svcType "ClusterIP") (not .Values.server.service.allowExternalExposure) -}}
{{- fail (printf "\n\nserver.service.type=%s would publish the semantic server outside the cluster.\nThe server trusts the X-Semantic-Role header, so exposing it directly means an\nunauthenticated query endpoint (on EKS, a public load balancer).\n\nUse the default ClusterIP and reach it with:\n  kubectl -n <ns> port-forward svc/%s-server %v:%v\n\nIf an authenticating proxy or ingress already fronts this service, opt in with:\n  --set server.service.allowExternalExposure=true\n" $svcType (include "semantic-operator.name" .) .Values.server.service.port .Values.server.service.port) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-operator.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
spec:
  type: {{ $svcType }}
  selector:
    app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
