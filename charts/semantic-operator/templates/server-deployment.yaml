apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-operator.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
spec:
  {{- /* Omitted when the autoscaler owns the count, so a helm upgrade does
         not reset the replicas the HPA had chosen. */ -}}
  {{- if not (.Values.server.autoscaling | default dict).enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
        app.kubernetes.io/component: server
      annotations:
        {{- /* Changes whenever the rendered server config changes, so a
               rollout is attributable to a config revision. */}}
        semantic.ossie.io/config-checksum: {{ include "semantic-operator.serverConfig" . | sha256sum | trunc 16 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.listenPort | quote }}
        prometheus.io/path: /metrics
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "semantic-operator.serverSA" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: "{{ include "semantic-operator.image" (dict "root" . "component" "server") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config={{ include "semantic-operator.configPath" . }}
          env:
            {{- /* Non-secret configuration comes from the mounted config file.
                   Only secrets are injected here as SEMANTIC__ env overrides. */}}
            {{- include "semantic-operator.enginePasswordEnv" (dict "root" . "component" "server") | nindent 12 }}
            {{- $valkey := .Values.valkey | default dict }}
            {{- if and $valkey.addr ($valkey.passwordSecret | default dict).name }}
            - name: SEMANTIC__CACHE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $valkey.passwordSecret.name }}
                  key: {{ $valkey.passwordSecret.key }}
            {{- end }}
            {{- if eq (.Values.engine.identityMode | default "static") "exchange" }}
            {{- $exSecret := (.Values.engine.exchange | default dict).clientSecretSecret | default dict }}
            {{- if $exSecret.name }}
            - name: SEMANTIC__ENGINE__IDENTITY__EXCHANGE__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $exSecret.name }}
                  key: {{ $exSecret.key | default "client-secret" }}
            {{- end }}
            {{- end }}
            {{- $providers := (.Values.server.authorization | default dict).providers | default list }}
            {{- range $i, $provider := $providers }}
            {{- $secret := $provider.bearerTokenSecret | default dict }}
            {{- if $secret.name }}
            - name: {{ printf "AUTHORIZATION_PROVIDER_TOKEN_%d" $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name }}
                  key: {{ $secret.key | default "token" }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.server.listenPort }}
              name: http
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- $startup := .Values.server.startupProbe | default dict }}
          {{- if $startup.enabled }}
          {{- /* For a cold start slower than the liveness probe tolerates,
                 usually a distant JWKS or engine. While this runs, liveness
                 is suspended, so a slow start cannot be mistaken for a hang. */}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ $startup.periodSeconds | default 5 }}
            failureThreshold: {{ $startup.failureThreshold | default 30 }}
          {{- end }}
          {{- $shutdown := .Values.server.gracefulShutdown | default dict }}
          {{- if and (ne $shutdown.enabled false) (semverCompare ">=1.29-0" .Capabilities.KubeVersion.Version) }}
          {{- /* Endpoint removal and pod termination race: without a pause the
                 server can stop while a proxy still lists it, and in-flight
                 requests fail. The pause lets the removal propagate first.

                 This is the native sleep action, not an exec hook, because the
                 image is distroless and has no shell to run one. It needs
                 Kubernetes 1.29 or newer, hence the version guard. */}}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $shutdown.preStopSleepSeconds | default 5 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/semantic-operator
              readOnly: true
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "semantic-operator.name" . }}-server-config
      {{- /* Must exceed the preStop pause plus the server's own 10s shutdown
             deadline, or the kubelet kills it mid-drain. */}}
      terminationGracePeriodSeconds: {{ (.Values.server.gracefulShutdown | default dict).terminationGracePeriodSeconds | default 30 }}
      {{- $spread := .Values.server.topologySpread | default dict }}
      {{- if ne $spread.enabled false }}
      {{- /* ScheduleAnyway, not DoNotSchedule. A hard constraint cannot be
             satisfied on a single-node or kind cluster and the pods would sit
             Pending, so the default prefers spreading and still schedules. */}}
      topologySpreadConstraints:
        - maxSkew: {{ $spread.maxSkew | default 1 }}
          topologyKey: {{ $spread.topologyKey | default "kubernetes.io/hostname" }}
          whenUnsatisfiable: {{ $spread.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
              app.kubernetes.io/component: server
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{/*
  Refuse to expose the semantic server outside the cluster by default. The
  server trusts X-Semantic-User and X-Semantic-Role headers and expects an
  authenticating proxy in front of it (see the server architecture docs), so a
  LoadBalancer here means an unauthenticated query endpoint on a public IP.
  Access it with `kubectl port-forward` instead. A deployment that really has
  an authenticating ingress in front can opt in explicitly.
*/}}
{{- $svcType := .Values.server.service.type -}}
{{- if and (ne $svcType "ClusterIP") (not .Values.server.service.allowExternalExposure) -}}
{{- fail (printf "\n\nserver.service.type=%s would publish the semantic server outside the cluster.\nThe server trusts X-Semantic-User and X-Semantic-Role, so exposing it directly means an\nunauthenticated query endpoint (on EKS, a public load balancer).\n\nUse the default ClusterIP and reach it with:\n  kubectl -n <ns> port-forward svc/%s-server %v:%v\n\nIf an authenticating proxy or ingress already fronts this service, opt in with:\n  --set server.service.allowExternalExposure=true\n" $svcType (include "semantic-operator.name" .) .Values.server.service.port .Values.server.service.port) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-operator.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "semantic-operator.labels" . | nindent 4 }}
spec:
  type: {{ $svcType }}
  selector:
    app.kubernetes.io/name: {{ include "semantic-operator.name" . }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
