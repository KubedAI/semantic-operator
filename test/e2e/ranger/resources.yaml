apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-db
  labels:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ranger
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranger
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              value: rangerR0cks!
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-db
  labels:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-admin
  labels:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ranger
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranger
        app.kubernetes.io/component: admin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          image: apache/ranger:2.9.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - >-
              until (echo > /dev/tcp/ranger-db/5432) >/dev/null 2>&1; do sleep 2; done
              && cp /home/ranger/scripts/ranger-admin-install.properties /config/install.properties
              && sed -i 's/ranger_admin_max_heap_size=1g/ranger_admin_max_heap_size=384m/' /config/install.properties
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: admin
          image: apache/ranger:2.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              value: rangerR0cks!
            - name: RANGER_DB_USER
              value: rangeradmin
            - name: RANGER_DB_PASSWORD
              value: rangerR0cks!
          ports:
            - name: http
              containerPort: 6080
          startupProbe:
            httpGet:
              path: /login.jsp
              port: http
            periodSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /login.jsp
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login.jsp
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /home/ranger/scripts/ranger-admin-install.properties
              subPath: install.properties
              readOnly: true
            - name: logs
              mountPath: /var/log/ranger
            - name: run
              mountPath: /var/run/ranger
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-admin
  labels:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: admin
  ports:
    - name: http
      port: 6080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-pdp
  labels:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: pdp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ranger
      app.kubernetes.io/component: pdp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranger
        app.kubernetes.io/component: pdp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pdp
          image: semantic-ranger-pdp:2.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RANGER_PDP_MAX_HEAP_SIZE
              value: 256m
          ports:
            - name: pdp
              containerPort: 6500
          startupProbe:
            httpGet:
              path: /health/ready
              port: pdp
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: pdp
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: pdp
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /opt/ranger/pdp/conf/ranger-pdp-site.xml
              subPath: ranger-pdp-site.xml
              readOnly: true
            - name: cache
              mountPath: /var/cache/ranger/pdp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ranger-pdp-config
            defaultMode: 0555
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-pdp
  labels:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: pdp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ranger
    app.kubernetes.io/component: pdp
  ports:
    - name: http
      port: 6500
      targetPort: pdp
