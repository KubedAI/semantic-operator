apiVersion: v1
kind: ConfigMap
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query-engine
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    catalog.management=static
  node.properties: |
    node.environment=semantic_e2e
    node.data-dir=/data/trino
  memory.properties: |
    connector.name=memory
    memory.max-data-per-node=512MB
  jvm.config: |
    -server
    -agentpath:/usr/lib/trino/bin/libjvmkill.so
    -XX:InitialRAMPercentage=25
    -XX:MaxRAMPercentage=65
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=256M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/component: query-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/component: query-engine
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trino
          image: docker.io/trinodb/trino:483
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /v1/info/state
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/info/state
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
              readOnly: true
            - name: config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
              readOnly: true
            - name: config
              mountPath: /etc/trino/catalog/memory.properties
              subPath: memory.properties
              readOnly: true
            - name: config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
              readOnly: true
            - name: data
              mountPath: /data/trino
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: trino
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/component: query-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: semantic-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: retail-data-loader
      ports:
        - protocol: TCP
          port: 8080
  egress: []
