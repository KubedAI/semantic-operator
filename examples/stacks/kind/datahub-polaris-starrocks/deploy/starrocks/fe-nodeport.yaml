# LOCAL KIND ONLY. The NodePort Services in this file are reachable only on
# the developer's laptop, because kind maps them to 127.0.0.1. Do NOT apply
# this file to a shared or cloud cluster: there a NodePort is reachable from
# the whole network. Cluster deployments use ClusterIP + kubectl port-forward.
# NodePort for the StarRocks FE. The kube-starrocks chart creates only a
# ClusterIP service (chd-fe-service); this exposes the FE on the node ports the
# kind cluster maps to the host (cluster.yaml: host 9030->30903 MySQL, host
# 8030->30803 HTTP), so the host reaches the FE at localhost:9030 with no
# port-forward. Selector mirrors chd-fe-service.
apiVersion: v1
kind: Service
metadata:
  name: chd-fe-nodeport
  namespace: chd
  labels:
    app.kubernetes.io/component: fe
    app.kubernetes.io/managed-by: chd-local
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: fe
    app.starrocks.ownerreference/name: chd-fe
  ports:
    - name: query
      port: 9030
      targetPort: 9030
      nodePort: 30903
    - name: http
      port: 8030
      targetPort: 8030
      nodePort: 30803
