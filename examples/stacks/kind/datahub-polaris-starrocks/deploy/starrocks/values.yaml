# kube-starrocks 1.11.6 values — 1 FE + 1 CN, shared-data, storage volume on
# Garage. BE disabled (shared-data uses CN). Image tag overridden to the pinned
# StarRocks 4.0.13 (chart default appVersion is 4.1). The FE builds the default
# storage volume from conf (enable_load_volume_from_conf) pointing at the Garage
# 'starrocks-storage' bucket, using the fixed local-dev key from garage-up.
#
# NOTE (confirm-on-run): shared-data FE conf keys + Garage S3 access are not
# offline-testable (StarRocks image not cached); first bring-up may need tuning.
operator:
  # operator image default (starrocks/operator:v1.11.6) matches the chart.
  starrocksOperator:
    enabled: true

starrocks:
  starrocksCluster:
    name: account-demo
    # shared-data: run CN, not BE.
    enabledBe: false
    enabledCn: true

  starrocksFESpec:
    replicas: 1
    image:
      repository: starrocks/fe-ubuntu
      tag: "4.0.13"
    storageSpec:
      name: fe            # PVC (default storageClass) so FE meta survives pod restarts
      storageSize: 10Gi
      logStorageSize: 5Gi
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { memory: "2Gi" }
    feEnvVars:
      AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
      AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
    config: |
      LOG_DIR = ${STARROCKS_HOME}/log
      JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xmx1024m -XX:+UseG1GC"
      http_port = 8030
      rpc_port = 9020
      query_port = 9030
      edit_log_port = 9010
      mysql_service_nio_enabled = true
      sys_log_level = INFO
      # First tablet creation on a cold CN can exceed the 10s default.
      tablet_create_timeout_second = 60
      # ---- shared-data mode: default storage volume on Garage (S3-compatible) ----
      run_mode = shared_data
      cloud_native_meta_port = 6090
      cloud_native_storage_type = S3
      enable_load_volume_from_conf = true
      aws_s3_path = starrocks-storage/starrocks
      aws_s3_endpoint = http://garage.account-demo.svc.cluster.local:3900
      aws_s3_region = garage
      aws_s3_use_aws_sdk_default_behavior = false
      aws_s3_use_instance_profile = false
      aws_s3_enable_path_style_access = true
      # Obviously-fake local-dev credentials (all "deadbeef", not a real key).
      # Garage requires GK+24hex / 64hex, so these mirror the fixed placeholder
      # in scripts/garage-up.sh; they must stay identical to it.
      aws_s3_access_key = GKdeadbeefdeadbeefdeadbeef
      aws_s3_secret_key = deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  starrocksCnSpec:
    replicas: 1
    image:
      repository: starrocks/cn-ubuntu
      tag: "4.0.13"
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { memory: "2560Mi" }
    config: |
      sys_log_level = INFO
      # Cap CN memory well under the container limit so it never OOM-guesses
      # from the node size; ample for the ~45k-row demo.
      mem_limit = 2G
      # CN receives shared-data storage config from the FE; ports left default.
