# semantic-operator Helm values for the local kind cluster. Images are built
# and kind-loaded by operator-build.sh (account-demo/manager:local, account-demo/server:local),
# so pullPolicy=IfNotPresent must find them locally. StarRocks is the engine;
# caching (Valkey) is disabled; the catalog is the Polaris-backed 'iceberg'.
image:
  manager:
    repository: account-demo/manager
    tag: local
    pullPolicy: IfNotPresent
  server:
    repository: account-demo/server
    tag: local
    pullPolicy: IfNotPresent

engine:
  type: starrocks

# Passwordless local StarRocks in namespace account-demo. engine.host is empty,
# so the legacy starrocks.host value below is used.
starrocks:
  host: starrocks.account-demo.svc.cluster.local
  port: 9030
  user: root
  icebergCatalog: iceberg

# Caching disabled on the host.
valkey:
  addr: ""

# Unused locally (no Glue catalog source at runtime); kept non-empty for the
# manager's AWS config init.
aws:
  region: us-east-1

manager:
  replicas: 1
  leaderElect: true
  resyncPeriod: 5m
  viewDatabase: semantic_views
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

server:
  replicas: 1
  logLevel: info
  listenPort: 8090
  auth:
    # A single-node kind cluster whose host mappings bind only to loopback, so
    # the trusted-header shortcut remains available for direct demo/debug use.
    # Never copy this to a shared cluster: any client reaching the port can
    # assert any role until the planned JWT cutover is complete.
    mode: header
    allowInsecureHeaderAuth: true
  # External, first-gate authorizer. The server calls OPA before it compiles a
  # model to SQL, so a deny here means the request never becomes a query. Models
  # opt in with spec.governance.external.providerRef: account-opa. Connection
  # details live here in deployment config, never in a SemanticModel.
  authorization:
    providers:
      - name: account-opa
        type: opa
        url: http://opa.account-demo.svc.cluster.local:8181
        timeoutSeconds: 2
        opa:
          decisionPath: semantic/query/allow
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
  service:
    type: ClusterIP
    port: 8090

# LOCAL KIND ONLY. The server uses trusted-header auth and the fixed NodePort is
# bound to 127.0.0.1 for demo/debug access. Disabling these policies also lets
# every pod in this local cluster reach the server, so never copy this override
# to a shared cluster. Set enabled=true to restore the chart's default lockdown.
networkPolicy:
  enabled: false
