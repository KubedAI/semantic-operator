# LOCAL KIND ONLY. The NodePort Services in this file are reachable only on
# the developer's laptop, because kind maps them to 127.0.0.1. Do NOT apply
# this file to a shared or cloud cluster: there a NodePort is reachable from
# the whole network. Cluster deployments use ClusterIP + kubectl port-forward.
# NodePort for the semantic server. The chart's semantic-operator-server
# service is ClusterIP with no pinned nodePort; this exposes it on the node
# port the kind cluster maps to the host (cluster.yaml: host 8090 -> 30809), so
# the host reaches the MCP/REST server at localhost:8090 with no port-forward.
apiVersion: v1
kind: Service
metadata:
  name: semantic-operator-server-nodeport
  namespace: semantic-system
  labels:
    app.kubernetes.io/name: semantic-operator
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: account-demo-local
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: semantic-operator
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30809
