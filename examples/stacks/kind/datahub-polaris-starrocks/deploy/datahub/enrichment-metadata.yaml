      "deprecation": {
        "deprecated": true,
        "note": "Deprecated and stale. Use account_feature_entitlement with usage_daily for governed current adoption analysis."
      },
      "upstreams": ["product-telemetry"]
    },
    "contract": {
      "domain": "revenue-operations",
      "owners": ["revenue-operations"],
      "glossary_terms": ["arr", "renewal-window"],
