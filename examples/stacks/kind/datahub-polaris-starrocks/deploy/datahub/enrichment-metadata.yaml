      "documentation": "Grain: one contract version per row.\nCadence: daily curated contract-system refresh.\nAs-of semantics: contract terms and boundaries available at the 2026-06-30 demo as-of date.\nApproved use: governed renewal-window filtering and certified recurring-revenue analysis.\nKnown limitations: negotiated discount, annual rate, and contract value are confidential; this dimension does not independently define recognized revenue.",
