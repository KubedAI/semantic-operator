      "domain": "product-analytics",
      "owners": ["product-analytics"],
      "glossary_terms": ["feature-adoption"],
      "tags": ["Deprecated", "Stale"],
      "documentation": "Grain: one row per account, product feature, and monthly snapshot.\nCadence: historical monthly aggregate with no current refresh.\nAs-of semantics: observations are stale relative to the 2026-06-30 demo as-of date.\nApproved use: lineage and deprecation demonstrations only; never use for current customer-health analysis or semantic execution.\nKnown limitations: deprecated stale aggregate, superseded by current entitlement and daily usage assets; intentionally has no semantic model, execution, or MCP linkage.",
