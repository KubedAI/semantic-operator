  "glossary_nodes": [
    {
      "id": "revenue-metrics",
      "name": "Revenue Metrics",
      "description": "Certified recurring-revenue, retention, and renewal concepts."
    },
    {
      "id": "adoption-metrics",
      "name": "Adoption Metrics",
      "description": "Certified product activity, seat utilization, and feature adoption concepts."
    },
    {
      "id": "support-metrics",
      "name": "Support Metrics",
      "description": "Certified support volume, escalation, SLA, and response-time concepts."
