  "transformation_jobs": [
    {
      "id": "curate-crm-assets",
      "flow_id": "customer-health-curation",
      "name": "Curate CRM account assets",
      "description": "Transforms CRM source records into the canonical account and primary-contact dimensions.",
      "inputs": ["crm-system"],
      "outputs": ["account", "account_primary_contact"],
      "owners": ["data-platform"]
    },
    {
      "id": "curate-revenue-assets",
      "flow_id": "customer-health-curation",
