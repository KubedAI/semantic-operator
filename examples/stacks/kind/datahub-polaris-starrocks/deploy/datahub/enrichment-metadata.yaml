        "semantic.mcp_tool": "query_metric"
      },
      "upstreams": ["crm-system"]
    },
    "account_feature_entitlement": {
      "domain": "product-analytics",
      "owners": ["product-analytics"],
      "glossary_terms": ["licensed-seat-utilization", "feature-adoption"],
      "tags": [],
      "documentation": "Grain: one current entitlement per account and product feature.\nCadence: daily curated entitlement refresh.\nAs-of semantics: licensed, eligible, and adopted seat capacity is an unsnapshotted current state as of 2026-06-30.\nApproved use: certified licensed-seat utilization and feature-adoption metrics grouped only by account or feature dimensions.\nKnown limitations: entitlement metrics do not support date dimensions because capacity is current and unsnapshotted; joining through dated usage would exclude zero-usage entitlements.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported entitlement fact."
      },
      "structured_properties": {
        "semantic.models": ["saas_adoption"],
        "semantic.dataset": "account_feature_entitlement",
