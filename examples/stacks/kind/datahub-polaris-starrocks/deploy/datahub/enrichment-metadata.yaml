  "glossary_terms": [
    {
      "id": "mrr",
      "name": "MRR",
      "definition": "Monthly recurring revenue at the fixed current subscription snapshot; historical rows contribute zero to the certified current metric.",
      "node": "revenue-metrics"
    },
    {
      "id": "arr",
      "name": "ARR",
      "definition": "Annual recurring revenue at the fixed current subscription snapshot, calculated as current monthly recurring revenue multiplied by twelve.",
      "node": "revenue-metrics"
    },
    {
      "id": "grr",
      "name": "GRR",
      "definition": "Gross revenue retention for the fixed baseline cohort: retained MRR divided by starting MRR, excluding expansion and new business and retaining churn as zero.",
      "node": "revenue-metrics"
    },
    {
      "id": "nrr",
      "name": "NRR",
      "definition": "Net revenue retention for the fixed baseline cohort: ending MRR divided by starting MRR, including contraction and expansion while excluding new business.",
      "node": "revenue-metrics"
    },
    {
      "id": "active-user",
      "name": "Active user",
      "definition": "A globally unique account user with qualifying product activity in the fixed 30-day current window.",
      "node": "adoption-metrics"
    },
    {
      "id": "active-account",
      "name": "Active account",
      "definition": "A distinct customer account with qualifying product activity in the fixed 30-day current window.",
      "node": "adoption-metrics"
    },
    {
      "id": "licensed-seat-utilization",
      "name": "Licensed-seat utilization",
      "definition": "Distinct active account-user-feature seat assignments divided by current licensed seats at account-feature grain; current unsnapshotted capacity means this metric does not support date dimensions.",
      "node": "adoption-metrics"
    },
    {
      "id": "feature-adoption",
      "name": "Feature adoption",
      "definition": "Current adopted eligible seats divided by current eligible seats at account-feature grain; current unsnapshotted capacity means this metric does not support date dimensions.",
      "node": "adoption-metrics"
    },
    {
      "id": "escalation",
      "name": "Escalation",
      "definition": "The share of available current-period support tickets marked escalated at the support observation cutoff.",
      "node": "support-metrics"
    },
    {
      "id": "sla-attainment",
      "name": "SLA attainment",
      "definition": "The share of available current-period support tickets whose service-level target was met at the support observation cutoff.",
      "node": "support-metrics"
    },
    {
      "id": "first-response",
      "name": "First response",
      "definition": "Elapsed hours from ticket creation to the first support response; the certified metric is the mean over available current-period observations.",
      "node": "support-metrics"
    },
    {
      "id": "resolution-time",
      "name": "Resolution time",
      "definition": "Elapsed hours from ticket creation to resolution; the certified mean excludes unresolved and non-current tickets.",
      "node": "support-metrics"
    },
    {
      "id": "renewal-window",
      "name": "Renewal window",
      "definition": "The half-open period from 2026-07-01 through 2026-10-01 used to identify current ARR approaching renewal.",
      "node": "revenue-metrics"
    },
    {
      "id": "enterprise-account",
      "name": "Enterprise account",
      "definition": "A customer account whose governed account segment is Enterprise.",
      "node": "customer-concepts"
    }
  ],
  "tags": [
