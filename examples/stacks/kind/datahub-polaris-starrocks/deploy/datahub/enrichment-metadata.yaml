  "assets": {
    "account": {
      "domain": "customer-operations",
      "owners": ["customer-operations", "data-platform"],
      "glossary_terms": ["enterprise-account", "renewal-window", "active-account"],
      "tags": [],
      "documentation": "Grain: one row per customer company account.\nCadence: daily curated dimension refresh.\nAs-of semantics: lifecycle, customer-success assignment, and renewal attributes describe the 2026-06-30 demo as-of state.\nApproved use: governed account segmentation, filtering, and grouping across certified revenue, adoption, and support metrics.\nKnown limitations: current-state dimension rather than a type-2 history; contact values reside in the separately governed primary-contact asset.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported shared account dimension."
      },
      "structured_properties": {
        "semantic.models": ["saas_revenue", "saas_adoption", "saas_support"],
        "semantic.dataset": "account",
        "semantic.physical_table": "iceberg.saas_customer_health_demo.account",
        "semantic.execution": "semantic-operator",
        "semantic.mcp_tool": "query_metric"
      },
      "upstreams": ["crm-system"]
    },
    "account_primary_contact": {
      "domain": "customer-operations",
