    "date_dim": {
      "domain": "data-platform",
      "owners": ["data-platform"],
      "glossary_terms": ["renewal-window"],
      "tags": [],
      "documentation": "Grain: one calendar date per row from 2024-07-01 through 2027-06-30.\nCadence: regenerated with the versioned demo dataset.\nAs-of semantics: stable calendar attributes support snapshot, usage, and ticket dates around the 2026-06-30 as-of date.\nApproved use: governed date grouping and filtering where the selected semantic metric supports dated analysis.\nKnown limitations: licensed-seat utilization and feature adoption do not support date dimensions because their entitlement capacity is current and unsnapshotted.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported shared calendar dimension."
