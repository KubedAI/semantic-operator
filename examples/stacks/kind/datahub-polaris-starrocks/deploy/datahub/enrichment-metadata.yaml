      "domain": "product-analytics",
      "owners": ["product-analytics", "data-platform"],
      "glossary_terms": ["feature-adoption", "licensed-seat-utilization"],
      "tags": [],
      "documentation": "Grain: one licensed product feature or module per row.\nCadence: daily curated product-catalog refresh.\nAs-of semantics: current feature name, product area, and criticality as of 2026-06-30.\nApproved use: shared feature grouping for certified adoption, usage, and support metrics.\nKnown limitations: current-state catalog with no rename history; nullable support feature links mean unclassified tickets remain in support totals through a left join.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported shared product-feature dimension."
      },
      "structured_properties": {
        "semantic.models": ["saas_adoption", "saas_support"],
        "semantic.dataset": "product_feature",
        "semantic.physical_table": "iceberg.saas_customer_health_demo.product_feature",
        "semantic.execution": "semantic-operator",
        "semantic.mcp_tool": "query_metric"
      },
      "upstreams": ["product-telemetry"]
    },
    "subscription_monthly": {
      "domain": "revenue-operations",
      "owners": ["revenue-operations"],
      "glossary_terms": ["mrr", "arr", "grr", "nrr", "renewal-window"],
      "tags": [],
      "documentation": "Grain: one account-subscription-month snapshot per row.\nCadence: monthly snapshots from 2024-07-01 through the current 2026-06-01 revenue snapshot.\nAs-of semantics: MRR and ARR use the fixed 2026-06-01 snapshot; GRR and NRR use the fixed 2025-06-01 baseline cohort measured at that current snapshot; renewal ARR uses the 2026-07-01 to 2026-10-01 half-open horizon.\nApproved use: certified governed MRR, ARR, renewal value, GRR, NRR, and average revenue per account.\nKnown limitations: current metrics are intentionally fixed-snapshot measures, not arbitrary point-in-time calculations; retention excludes new business and GRR excludes expansion.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported recurring-revenue fact."
      },
      "structured_properties": {
        "semantic.models": ["saas_revenue"],
        "semantic.dataset": "subscription_monthly",
        "semantic.physical_table": "iceberg.saas_customer_health_demo.subscription_monthly",
        "semantic.execution": "semantic-operator",
        "semantic.mcp_tool": "query_metric"
      },
      "upstreams": ["billing-system", "contract-system"]
    },
    "support_ticket": {
      "domain": "customer-operations",
      "owners": ["customer-operations"],
      "glossary_terms": ["escalation", "sla-attainment", "first-response", "resolution-time"],
      "tags": ["FreshnessWarning"],
      "fields": {
        "requester_email": {"tags": ["PII"]},
        "subject": {"tags": ["PII"]}
      },
      "documentation": "Grain: one support ticket per row.\nCadence: expected daily through the 2026-06-30 as-of date, but the observed source stops on 2026-06-28.\nAs-of semantics: ticket status, escalation, SLA, response, and resolution measures are evaluated at the 2026-06-28 observation cutoff for the nominal 90-day window beginning 2026-04-02.\nApproved use: certified governed support volume, escalation, SLA-attainment, first-response, and resolution metrics when the freshness warning is disclosed.\nKnown limitations: a two-day freshness gap omits June 29-30, so results must not be represented as complete through 2026-06-30; requester email and subject are PII.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported support fact with a documented two-day freshness warning."
      },
      "structured_properties": {
        "semantic.models": ["saas_support"],
        "semantic.dataset": "support_ticket",
        "semantic.physical_table": "iceberg.saas_customer_health_demo.support_ticket",
        "semantic.execution": "semantic-operator",
        "semantic.mcp_tool": "query_metric"
      },
      "upstreams": ["support-platform"]
    },
    "usage_daily": {
      "domain": "product-analytics",
      "owners": ["product-analytics"],
      "glossary_terms": ["active-user", "active-account", "licensed-seat-utilization", "feature-adoption"],
      "tags": [],
      "documentation": "Grain: one account-user-feature-day event or observation per row.\nCadence: daily curated product-telemetry refresh.\nAs-of semantics: active IDs and counters represent the fixed 30-day window from 2026-06-01 through 2026-07-01, with values outside the window null or zero.\nApproved use: certified governed active-user, active-account, product-error, active-day, and fan-out-safe licensed-seat-utilization analysis.\nKnown limitations: licensed-seat utilization must use current account-feature entitlements and does not support date dimensions; sparse activity is not evidence that an entitlement does not exist.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported daily usage fact."
      },
      "structured_properties": {
        "semantic.models": ["saas_adoption"],
        "semantic.dataset": "usage_daily",
        "semantic.physical_table": "iceberg.saas_customer_health_demo.usage_daily",
        "semantic.execution": "semantic-operator",
        "semantic.mcp_tool": "query_metric"
      },
      "upstreams": ["product-telemetry"]
    }
  }
}
