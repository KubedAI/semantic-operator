        "email": {"tags": ["PII"]},
        "phone": {"tags": ["PII"]},
        "job_title": {"tags": ["PII"]}
      },
      "documentation": "Grain: exactly one primary contact per customer account.\nCadence: daily curated CRM refresh.\nAs-of semantics: current primary-contact assignment as of 2026-06-30; no contact history is retained.\nApproved use: role-governed renewal workflows that require current contact name, email, phone, or job title.\nKnown limitations: all contact attributes are PII and access is governed at semantic compile time; one-row grain does not represent secondary contacts.",
      "certification": "CERTIFIED",
      "deprecation": {
        "deprecated": false,
        "note": "Current supported primary-contact dimension."
      },
      "structured_properties": {
        "semantic.models": ["saas_revenue"],
        "semantic.dataset": "account_primary_contact",
        "semantic.physical_table": "iceberg.saas_customer_health_demo.account_primary_contact",
