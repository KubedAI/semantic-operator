# LOCAL KIND ONLY. The NodePort Services in this file are reachable only on
# the developer's laptop, because kind maps them to 127.0.0.1. Do NOT apply
# this file to a shared or cloud cluster: there a NodePort is reachable from
# the whole network. Cluster deployments use ClusterIP + kubectl port-forward.
# DataHub MCP server: exposes DataHub's metadata (search, entities, schema,
# lineage, glossary, structured properties) to the host agent over MCP
# streamable HTTP. It talks to GMS in-cluster; GMS auth is disabled locally so
# the token is a placeholder. Built by scripts/datahub-mcp-build.sh as
# account-demo/datahub-mcp:local (installs mcp-server-datahub from PyPI) and loaded with
# `kind load` (imagePullPolicy=Never).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datahub-mcp
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub-mcp
    app.kubernetes.io/managed-by: account-demo-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datahub-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datahub-mcp
    spec:
      containers:
        - name: datahub-mcp
          image: account-demo/datahub-mcp:local
          imagePullPolicy: Never
          env:
            # In-cluster GMS. Auth disabled in the local demo, so token is empty.
            - { name: DATAHUB_GMS_URL, value: "http://datahub-datahub-gms:8080" }
            - { name: DATAHUB_GMS_TOKEN, value: "" }
            # Disable acryl-datahub usage telemetry. Without this the SDK blocks
            # on startup retrying track.datahubproject.io, which has no egress in
            # the local cluster (ConnectTimeoutError on /mp/engage).
            - { name: DATAHUB_TELEMETRY_ENABLED, value: "false" }
            - { name: FASTMCP_HOST, value: "0.0.0.0" }
            - { name: FASTMCP_PORT, value: "8000" }
            - { name: FASTMCP_STREAMABLE_HTTP_PATH, value: "/mcp" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits: { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: datahub-mcp
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub-mcp
    app.kubernetes.io/managed-by: account-demo-local
spec:
  selector:
    app.kubernetes.io/name: datahub-mcp
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
# NodePort so the host agent reaches the MCP at localhost:8091/mcp
# (cluster.yaml maps host 8091 -> nodePort 30811).
apiVersion: v1
kind: Service
metadata:
  name: datahub-mcp-nodeport
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub-mcp
    app.kubernetes.io/managed-by: account-demo-local
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: datahub-mcp
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30811 }
