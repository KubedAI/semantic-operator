# DataHub v1.6.0 for the local kind cluster: full deployment (GMS +
# React frontend) trimmed to single replicas and minimal resources.
#
# Relational store is the shared Postgres 'datahub' DB (not the bundled MySQL).
# Graph + search are the OpenSearch from the prerequisites release. neo4j is
# unused. The password comes from the datahub-postgres Secret created by
# datahub-up.sh (mirrored from the account-demo postgres-credentials Secret).

global:
  datahub:
    version: v1.6.0
    # Local dev cluster with no external exposure: disable DataHub's
    # metadata-service authentication so the client-side ingestion/enrichment
    # (and the agent) reach GMS without a personal access token. Re-enable this
    # (and mint a PAT) if the cluster is ever exposed beyond localhost.
    metadata_service_authentication:
      enabled: false
  graph_service_impl: elasticsearch

  sql:
    datasource:
      host: "postgres.account-demo.svc.cluster.local:5432"
      hostForpostgresqlClient: "postgres.account-demo.svc.cluster.local"
      port: "5432"
      url: "jdbc:postgresql://postgres.account-demo.svc.cluster.local:5432/datahub"
      driver: "org.postgresql.Driver"
      database: "datahub"
      username: "datahub"
      password:
        secretRef: datahub-postgres
        secretKey: postgres-password

  elasticsearch:
    host: "opensearch-cluster-master"
    port: "9200"

  kafka:
    bootstrap:
      server: "prerequisites-kafka:9092"

# --- components: full but single-replica / minimal ---
datahub-gms:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests: {cpu: "100m", memory: "768Mi"}
    limits: {memory: "1536Mi"}

datahub-frontend:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
  oidcAuthentication:
    enabled: true
    provider: other
    clientId: datahub
    clientSecretRef:
      secretRef: datahub-oidc
      secretKey: client-secret
    discoveryUri: "https://auth.localtest.me:8443/realms/saas-accounts/.well-known/openid-configuration"
    oidcBaseUrl: "https://datahub.localtest.me:8443"
    scope: "openid profile email"
    user_name_claim: preferred_username
    user_name_claim_regex: "(.+)"
  authCookies:
    sameSite: "LAX"
    secure: "true"
  extraEnvs:
    - name: JAVA_TOOL_OPTIONS
      value: "-Djavax.net.ssl.trustStore=/etc/datahub/oidc/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
  extraVolumes:
    - name: gateway-ca
      configMap:
        name: gateway-ca
    - name: oidc-truststore
      emptyDir: {}
  extraVolumeMounts:
    - name: oidc-truststore
      mountPath: /etc/datahub/oidc
      readOnly: true
  extraInitContainers:
    - name: prepare-oidc-truststore
      image: quay.io/keycloak/keycloak:26.6
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          java_path="$(readlink -f "$(command -v java)")"
          cacerts="$(dirname "$(dirname "$java_path")")/lib/security/cacerts"
          cp "$cacerts" /truststore/cacerts
          chmod 0644 /truststore/cacerts
          keytool -importcert -noprompt -trustcacerts \
            -alias saas-accounts-local-ca \
            -file /gateway-ca/ca.crt \
            -keystore /truststore/cacerts \
            -storepass changeit
          chmod 0444 /truststore/cacerts
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - name: gateway-ca
          mountPath: /gateway-ca
          readOnly: true
        - name: oidc-truststore
          mountPath: /truststore
  resources:
    requests: {cpu: "50m", memory: "256Mi"}
    limits: {memory: "640Mi"}

# Ingestion runs client-side (uv), so the in-cluster actions pod is not needed.
acryl-datahub-actions:
  enabled: false

# Consumers run embedded in GMS (standalone consumers disabled), so no separate
# consumer pods.
datahub-mae-consumer:
  enabled: false
datahub-mce-consumer:
  enabled: false
datahub-ingestion-cron:
  enabled: false

# Schema creation for Postgres: use the postgres setup job; mysql setup off.
mysqlSetupJob:
  enabled: false
postgresqlSetupJob:
  enabled: true

# System-update job builds ES indices + bootstraps; keep enabled (default).
