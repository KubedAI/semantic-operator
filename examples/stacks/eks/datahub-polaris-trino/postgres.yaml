# Postgres 16 for the Polaris metastore on EKS. Passwords come from the
# script-generated Secret postgres-credentials (never committed). Storage is a
# PVC on the cluster's default StorageClass so the catalog survives pod
# restarts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: chd
data:
  10-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-SQL
      CREATE ROLE polaris LOGIN PASSWORD '$POLARIS_DB_PASSWORD';
      CREATE DATABASE polaris OWNER polaris;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: chd
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chd
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - {containerPort: 5432, name: pg}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - name: POLARIS_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POLARIS_DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: init
          configMap: {name: postgres-init, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chd
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: pg}
