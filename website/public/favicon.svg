<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Semantic Operator">
  <!--
    The mark encodes what the project does: several differently-worded questions
    converge through a governed aperture into exactly one statement.

    Left: three inbound strokes at different angles (the same question asked
    three ways). Centre: a square boundary with an aperture, the compile-time
    governance gate. Right: one stroke leaving. The convergence point is the
    only filled element, because determinism is the thesis.

    Drawn on a 32px grid with 2px strokes so it stays legible as a favicon.
  -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M2 8 L11 14" opacity="0.45"/>
    <path d="M2 16 L11 16" opacity="0.7"/>
    <path d="M2 24 L11 18" opacity="0.45"/>
    <path d="M21 16 L30 16"/>
  </g>
  <rect x="11" y="6" width="10" height="20" rx="2.5"
        stroke="currentColor" stroke-width="2" fill="none" opacity="0.9"/>
  <circle cx="16" cy="16" r="3" fill="currentColor"/>
</svg>
