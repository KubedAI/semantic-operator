<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Operator architecture</title>
  <desc id="desc">Ossiectl creates an Apache Ossie model from catalogs, engines, and DataHub. Semantic Operator validates and publishes it on Kubernetes. Agents and applications query the Semantic Server, while BI tools use governed views on Trino or StarRocks.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/>
      <stop offset="0.52" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#effbf6"/>
    </linearGradient>
    <linearGradient id="author" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="operate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="serve" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#059669"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#059669"/></marker>
    <style>
      .heading{font:700 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#fff;letter-spacing:.2px}
      .eyebrow{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1.6px}
      .title{font:700 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
      .body{font:500 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#526078}
      .small{font:600 11px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#344158}
      .card{fill:#fff;stroke:#dbe4f0;stroke-width:1.5}
      .flow{fill:none;stroke-width:2.5;stroke-linecap:round}
      .dash{stroke-dasharray:6 7}
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#canvas)"/>
  <text x="40" y="38" class="eyebrow" fill="#6d28d9">SEMANTIC OPERATOR</text>
  <text x="40" y="70" style="font:750 27px ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#111827">From business meaning to governed SQL</text>
  <text x="40" y="96" class="body">Define once. Validate continuously. Serve the same certified definitions everywhere.</text>

  <!-- stage containers -->
  <rect x="30" y="125" width="350" height="455" rx="18" fill="#fbfaff" stroke="#ddd2fe" stroke-width="1.5"/>
  <rect x="425" y="125" width="350" height="455" rx="18" fill="#f8fbff" stroke="#c9ddff" stroke-width="1.5"/>
  <rect x="820" y="125" width="350" height="455" rx="18" fill="#f7fdf9" stroke="#bfe9d2" stroke-width="1.5"/>
  <rect x="30" y="125" width="350" height="52" rx="18" fill="url(#author)"/>
  <path d="M30 159h350v18H30z" fill="url(#author)"/>
  <rect x="425" y="125" width="350" height="52" rx="18" fill="url(#operate)"/>
  <path d="M425 159h350v18H425z" fill="url(#operate)"/>
  <rect x="820" y="125" width="350" height="52" rx="18" fill="url(#serve)"/>
  <path d="M820 159h350v18H820z" fill="url(#serve)"/>
  <text x="52" y="158" class="heading">1 · Author the model</text>
  <text x="447" y="158" class="heading">2 · Operate on Kubernetes</text>
  <text x="842" y="158" class="heading">3 · Serve every consumer</text>

  <!-- authoring -->
  <rect class="card" filter="url(#shadow)" x="62" y="205" width="286" height="74" rx="12"/>
  <circle cx="91" cy="242" r="18" fill="#ede9fe"/>
  <path d="M82 237h18M82 243h18M82 249h18" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="234" class="title">Catalogs, engines, metadata</text>
  <text x="120" y="257" class="body">Glue · Polaris · DataHub · engines</text>

  <path class="flow" d="M205 279v34" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <text x="216" y="302" class="small">read structure + meaning</text>

  <rect x="83" y="318" width="244" height="76" rx="13" fill="url(#author)" filter="url(#shadow)"/>
  <text x="205" y="349" text-anchor="middle" class="heading">Ossiectl CLI</text>
  <text x="205" y="373" text-anchor="middle" style="font:500 13px ui-sans-serif,system-ui;fill:#f3e8ff">derive · enrich · validate</text>

  <path class="flow" d="M205 394v34" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <rect class="card" filter="url(#shadow)" x="75" y="433" width="260" height="82" rx="12"/>
  <path d="M98 451h34l12 12v34H98z" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M132 451v13h12" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="160" y="466" class="title">Apache Ossie model</text>
  <text x="160" y="489" class="mono">semanticmodel.yaml</text>

  <!-- control plane -->
  <rect class="card" filter="url(#shadow)" x="466" y="205" width="268" height="66" rx="12"/>
  <circle cx="496" cy="238" r="18" fill="#dbeafe"/>
  <path d="M488 238h16M496 230v16" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="525" y="233" class="title">SemanticModel</text>
  <text x="525" y="253" class="body">Kubernetes custom resource</text>

  <path class="flow" d="M600 271v34" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="478" y="310" width="244" height="92" rx="13" fill="url(#operate)" filter="url(#shadow)"/>
  <text x="600" y="340" text-anchor="middle" class="heading">Semantic Operator</text>
  <text x="600" y="365" text-anchor="middle" style="font:500 13px ui-sans-serif,system-ui;fill:#e0f2fe">validate · compile · drift-check</text>
  <text x="600" y="384" text-anchor="middle" style="font:500 13px ui-sans-serif,system-ui;fill:#e0f2fe">publish · manage views</text>

  <path class="flow" d="M600 402v34" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect class="card" filter="url(#shadow)" x="466" y="441" width="268" height="74" rx="12"/>
  <circle cx="496" cy="478" r="18" fill="#cffafe"/>
  <path d="M487 471h18v14h-18zM490 467h12" fill="none" stroke="#0891b2" stroke-width="2" stroke-linejoin="round"/>
  <text x="525" y="472" class="title">Versioned artifact</text>
  <text x="525" y="493" class="body">Last valid version keeps serving</text>

  <!-- serving -->
  <rect class="card" filter="url(#shadow)" x="850" y="202" width="290" height="84" rx="12"/>
  <circle cx="882" cy="233" r="8" fill="#10b981"/><circle cx="905" cy="233" r="8" fill="#34d399"/><circle cx="928" cy="233" r="8" fill="#6ee7b7"/>
  <text x="956" y="238" class="title">Agents · apps · BI tools</text>
  <text x="882" y="267" class="body">MCP · REST · governed SQL views</text>

  <path class="flow" d="M995 286v30" stroke="#059669" marker-end="url(#arrow-green)"/>
  <rect x="873" y="321" width="244" height="82" rx="13" fill="url(#serve)" filter="url(#shadow)"/>
  <text x="995" y="351" text-anchor="middle" class="heading">Semantic Server × N</text>
  <text x="995" y="376" text-anchor="middle" style="font:500 13px ui-sans-serif,system-ui;fill:#d1fae5">authenticate · govern · plan</text>
  <text x="995" y="394" text-anchor="middle" style="font:500 13px ui-sans-serif,system-ui;fill:#d1fae5">execute one SQL statement</text>

  <rect x="835" y="423" width="108" height="34" rx="17" fill="#ecfdf5" stroke="#86efac"/>
  <text x="889" y="445" text-anchor="middle" class="small" fill="#047857">OPA / Ranger</text>
  <rect x="1047" y="423" width="108" height="34" rx="17" fill="#ecfdf5" stroke="#86efac"/>
  <text x="1101" y="445" text-anchor="middle" class="small" fill="#047857">Valkey cache</text>

  <path class="flow" d="M995 403v60" stroke="#059669" marker-end="url(#arrow-green)"/>
  <rect class="card" filter="url(#shadow)" x="873" y="468" width="244" height="66" rx="12"/>
  <ellipse cx="906" cy="489" rx="16" ry="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <path d="M890 489v17c0 4 7 7 16 7s16-3 16-7v-17" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="940" y="495" class="title">Trino or StarRocks</text>
  <text x="940" y="516" class="body">one governed SELECT</text>

  <!-- cross-stage flows -->
  <path class="flow" d="M335 474 C392 474 399 238 458 238" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="flow" d="M734 478 C795 478 805 362 865 362" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="flow dash" d="M722 380 C790 405 770 552 865 520" stroke="#2563eb" marker-end="url(#arrow-blue)"/>

  <text x="600" y="604" text-anchor="middle" class="small">The Semantic Operator and Semantic Server coordinate through versioned Kubernetes artifacts. They never call each other.</text>
</svg>
