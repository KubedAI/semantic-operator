name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint and verify Go formatting
        run: make lint
      - name: Test
        run: make test
      - name: Verify generated code is current
        run: |
          make generate
          git diff --exit-code

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # helm itself is pinned in the Makefile (HELM_VERSION) and downloaded into
      # bin/, so CI and local runs lint and unit test the chart with the same
      # helm. The chart's behaviour is asserted by the unit tests in
      # charts/semantic-operator/tests/ (engine selection and the legacy
      # starrocks fallback, auth guardrails, manager cache/RBAC scope,
      # availability defaults, and Service exposure). They render the templates
      # and assert on the result instead of grepping rendered YAML.
      - name: Lint and unit test the chart
        run: make helm-lint helm-unittest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build --target manager -t manager:ci .
          docker build --target server -t server:ci .
