name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint and verify Go formatting
        run: make lint
      - name: Test
        run: make test
      - name: Verify generated code is current
        run: |
          make generate
          git diff --exit-code
  

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/semantic-operator
      - name: Chart must refuse to expose the server publicly
        run: |
          helm template charts/semantic-operator \
            --set image.repository=example.com/semantic-operator \
            --set engine.host=engine.example \
            --set server.service.type=LoadBalancer >/dev/null 2>&1 \
            && { echo "chart allowed a LoadBalancer Service"; exit 1; } || true
          helm template charts/semantic-operator \
            --set image.repository=example.com/semantic-operator \
            --set engine.host=engine.example \
            | grep -q 'type: ClusterIP' || { echo "default Service is not ClusterIP"; exit 1; }
      - name: Render templates (starrocks, legacy values)
        run: >
          helm template charts/semantic-operator
          --set image.repository=example.com/semantic-operator
          --set starrocks.host=fe.example >/dev/null
      - name: Render templates (trino)
        run: >
          helm template charts/semantic-operator
          --set image.repository=example.com/semantic-operator
          --set engine.type=trino --set engine.host=trino.example >/dev/null
      - name: Chart must reject an unknown engine
        run: |
          helm template charts/semantic-operator \
            --set image.repository=example.com/semantic-operator \
            --set engine.host=engine.example \
            --set engine.type=nonesuch >/dev/null 2>&1 \
            && { echo "chart accepted an unknown engine.type"; exit 1; } || true
      # The chart checks above only cover the chart. This scans every manifest
      # in the repository, which is where a stray LoadBalancer actually crept in
      # once.
      - name: No public Service exposure anywhere in the repository
        run: bash hack/check-no-public-services.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build --target manager -t manager:ci .
          docker build --target server -t server:ci .
